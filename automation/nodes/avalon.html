<script type="text/javascript">
(function () {
  const style = { category: "Avalon", color: "#9caeed", icon: "font-awesome/fa-book" };
  function prepareInputs() {
    const selected = this.reportInputs || [], list = $("#avalon-report-inputs").empty();
    const incoming = new Map(), seen = new Set([this.id]);
    RED.nodes.eachLink(({ source, target }) => {
      if (source.z !== this.z || target.z !== this.z) return;
      if (!incoming.has(target.id)) incoming.set(target.id, []);
      incoming.get(target.id).push(source);
    });
    const visit = (id) => {
      for (const node of incoming.get(id) || []) {
        if (seen.has(node.id)) continue;
        seen.add(node.id); visit(node.id);
        if (!["avalon-research", "avalon-hermes"].includes(node.type) || (this.type === "avalon-research" && node.type !== "avalon-research")) continue;
        const checkbox = $("<input>", { type: "checkbox", value: node.id }).prop("checked", selected.includes(node.id));
        $("<label>").css({ display: "block", width: "auto" }).append(checkbox, document.createTextNode(" " + (node.name || node.topic || node.id))).appendTo(list);
      }
    };
    visit(this.id);
    if (!list.children().length) list.text("Önce girdi üretecek görevleri ekleyin.");
  }
  function saveInputs() {
    this.reportInputs = $("#avalon-report-inputs input:checked").map(function () { return this.value; }).get();
  }
  const taskDefaults = { reportInputs: { value: [] }, maxAttempts: { value: 3 }, timeoutMs: { value: 7200000 },
    onError: { value: "stop" }, requireApproval: { value: false } };
  RED.nodes.registerType("avalon-start", {
    ...style, defaults: { name: { value: "" } }, inputs: 0, outputs: 1,
    label: function () { return this.name || "Avalon Başlangıç"; }
  });
  RED.nodes.registerType("avalon-research", {
    ...style, inputs: 1, outputs: 2, outputLabels: ["Tamamlandı", "Hata"],
    defaults: { ...taskDefaults, name: { value: "" }, topic: { value: "", required: true }, purpose: { value: "" },
      sites: { value: "" }, mode: { value: "deep" }, breadth: { value: 3 }, depth: { value: 2 } },
    label: function () { return this.name || this.topic || "Avalon Araştırma"; },
    oneditprepare: prepareInputs, oneditsave: saveInputs
  });
  RED.nodes.registerType("avalon-hermes", {
    ...style, icon: "font-awesome/fa-cogs", inputs: 1, outputs: 2, outputLabels: ["Tamamlandı", "Hata"],
    defaults: { ...taskDefaults, name: { value: "" }, prompt: { value: "", required: true },
      workingDirectory: { value: "" }, outputType: { value: "text" }, requiredFields: { value: "" }, requiredFiles: { value: "" } },
    label: function () { return this.name || "Hermes Görevi"; },
    oneditprepare: prepareInputs, oneditsave: saveInputs
  });
  RED.nodes.registerType("avalon-finish", {
    ...style, defaults: { name: { value: "" } }, inputs: 1, outputs: 0,
    label: function () { return this.name || "Avalon Bitiş"; }
  });
})();
</script>

</script>

</script>
